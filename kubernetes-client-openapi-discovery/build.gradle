plugins {
    id 'io.micronaut.build.internal.kubernetes-module'
}

dependencies {
    api(projects.micronautKubernetesClientOpenapiInformer)
    api(projects.micronautKubernetesDiscoveryClientCore)
    api(libs.micronaut.discovery.client)
    compileOnly(mn.micronaut.management)

    testImplementation(projects.testUtilsOpenapi)
}

project.tasks.withType(Test).configureEach {
    environment.put("KUBERNETES_SERVICE_HOST", "localhost")
    environment.put("HOSTNAME", "test-pod")
}
