micronaut:
  application:
    name: micronaut-kubernetes-example-service-openapi
  config-client:
    enabled: true
kubernetes:
  client:
    secrets:
      enabled: true
      use-api: true
      excludes: mounted-secret
      paths:
        - /etc/example-service/secrets
    config-maps:
      enabled: true
      use-api: true
      excludes: mounted-configmap
      paths:
        - /etc/example-service/configmap
