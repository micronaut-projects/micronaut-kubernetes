plugins {
    id 'io.micronaut.build.internal.kubernetes-kotlin-examples'
}

micronaut {
    version libs.versions.micronaut.platform.get()
    runtime("netty")
    testRuntime("junit5")
}

dependencies {
    implementation(projects.micronautKubernetesClientOpenapiInformer)
    testImplementation(mnTest.mockito.core)
}

application {
    mainClass.set("micronaut.client.ApplicationKt")
}
