plugins {
    id 'io.micronaut.build.internal.kubernetes-module'
}

dependencies {
    annotationProcessor mn.micronaut.graal
    annotationProcessor projects.micronautKubernetesClientProcessor

    api mn.micronaut.inject.java
    api libs.io.kubernetes.client.java

    implementation mn.micronaut.runtime
    compileOnly libs.graal.svm

    testAnnotationProcessor mn.micronaut.inject.java

    testImplementation mnSerde.micronaut.serde.jackson
    testImplementation projects.testUtils
    testRuntimeOnly mn.snakeyaml

    constraints {
        api('com.fasterxml.jackson.core:jackson-databind:2.22.2') {
            because 'Older versions have security vulnerabilities'
        }
        api('org.apache.httpcomponents.client5:httpclient5:5.6.4') {
            because 'Older versions have security vulnerabilities'
        }
        api('org.apache.httpcomponents.core5:httpcore5-h2:5.4.3') {
            because 'Older versions have security vulnerabilities'
        }
    }
}

tasks.withType(me.champeau.gradle.japicmp.JapicmpTask) {
    packageExcludes = ["io.micronaut.kubernetes.client"]
}
