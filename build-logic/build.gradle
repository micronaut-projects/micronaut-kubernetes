plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

configurations {
    groovyCompiler {
        shouldResolveConsistentlyWith(configurations.testCompileClasspath)
    }
}

dependencies {
    groovyCompiler("org.apache.groovy:groovy")
    implementation("org.yaml:snakeyaml:2.7")
    testImplementation platform("io.micronaut.test:micronaut-test-bom:5.2.0")
    testImplementation("org.spockframework:spock-core")
    testRuntimeOnly("org.junit.platform:junit-platform-suite")
}

gradlePlugin {
    plugins {
        kubernetesClientOpenApi {
            id = "io.micronaut.kubernetes.client.openapi"
            implementationClass = "io.micronaut.kubernetes.client.openapi.KubernetesClientOpenApiPlugin"
        }
    }
}

tasks.withType(GroovyCompile).configureEach {
    // Use the Groovy version resolved with Spock on the test classpath.
    groovyClasspath = files(configurations.groovyCompiler)
}

test {
    useJUnitPlatform()
}
